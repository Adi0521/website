name: ci
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Install glslang
        run: sudo apt-get update -qq && sudo apt-get install -y glslang-tools

      # Puppeteer downloads ~150MB of Chrome on install; setup-node's cache
      # only covers ~/.npm, so without this it is re-fetched every run.
      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - name: Validate shaders
        run: npm run validate
      # Includes the prerender pass, which writes a real HTML file per route so
      # the site is indexable — a client-rendered SPA serves crawlers nothing.
      - name: Typecheck, build and prerender
        run: npm run build

      # Temporal behaviour goes through the unit harness, never a screenshot —
      # software rendering runs ~1s of simulated time in 25 real seconds.
      - name: Sim unit tests
        run: npm run test:sim

      # §14.4 — loads the page, asserts no runtime errors, and confirms both
      # that a frame came out and that a press leaves a depression with a rim.
      # It cannot judge the look: SwiftShader collapses the value noise to a
      # constant, in the prototype exactly as in the engine.
      - name: Scene smoke test
        run: npm run smoke

      # Guards the assumption the two-mode design rests on: one WebGL context
      # for the whole session. Presses a mark into the sand, navigates the real
      # routes, and looks for it afterwards, with a full page load as control.
      - name: Context persistence
        run: npm run check:context
